<style>
/* Layout: 全画面の3D星図。左上にタイトル、右側にパネル（スマホでは下から出るシート）。夜空のような単一ダークテーマ。 */
:root {
  color-scheme: dark;
  --sky: #0b1230;
  --sky-2: #121c45;
  --ink: #eef1ff;
  --ink-dim: #a9b1d6;
  --line: rgba(170, 182, 240, .22);
  --panel: rgba(16, 24, 60, .86);
  --panel-solid: #141d4a;
  --accent: #ffd166;
  --accent-ink: #2a1d00;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r: 14px;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 30% 20%, var(--sky-2), var(--sky) 60%);
  background-color: var(--sky);
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top > * { pointer-events: auto; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 38px); line-height: 1.1; margin: 0; letter-spacing: .04em; }
.brand p { margin: 4px 0 0; color: var(--ink-dim); font-size: 13px; max-width: 30em; }
.tools { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.modes { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(8px); }
.modes button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 13px; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.search { display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; backdrop-filter: blur(8px); }
.search input { background: transparent; border: 0; color: var(--ink); font: inherit; width: 13em; min-width: 0; }
.search input::placeholder { color: var(--ink-dim); }
.search button { border: 0; background: transparent; padding: 4px 8px; border-radius: 999px; }

.legend {
  position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(150px + env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; gap: 6px; font-size: 12.5px;
}
.legend button { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 6px; text-align: left; backdrop-filter: blur(6px); }
.legend .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
.legend .kwcats { display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 220px; margin-top: 4px; color: var(--ink-dim); font-size: 11.5px; }
.legend .kwcats span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 4px; vertical-align: 1px; }

.dock {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 32px);
}
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 10px 18px; backdrop-filter: blur(8px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; box-shadow: 0 6px 30px rgba(255, 209, 102, .35); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.hint { position: fixed; z-index: 3; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); color: var(--ink-dim); font-size: 12px; text-align: right; }

.panel {
  position: fixed; z-index: 7; top: calc(128px + env(safe-area-inset-top, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(12px);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; }
.panel header h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; flex: 1; min-width: 0; letter-spacing: .03em; }
.panel .x { border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 8px; color: var(--ink-dim); }
.panel .body { overflow-y: auto; padding: 0 16px 16px; min-height: 0; }
.panel h3 { font-size: 13px; color: var(--ink-dim); font-weight: 700; margin: 16px 0 6px; letter-spacing: .06em; }

.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; background: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.stage { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: rgba(255,255,255,.1); }
.fieldtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-dim); }
.fieldtag i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.hook { font-size: 17px; font-weight: 700; line-height: 1.5; margin: 6px 0 4px; text-wrap: balance; }
.lesson-title { font-size: 14px; color: var(--ink-dim); margin: 0; }
ol.steps { margin: 0; padding-left: 1.4em; }
ol.steps li { margin: 2px 0; }
.muted { color: var(--ink-dim); font-size: 12.5px; }
.list-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; }
.list-item:hover { background: rgba(255,255,255,.07); }

/* おすすめ */
.dist { display: grid; grid-template-columns: 1fr; gap: 6px; }
.dist-row { display: grid; grid-template-columns: 10.5em 1fr 2.6em; align-items: center; gap: 8px; font-size: 12.5px; }
.dist-row .fieldtag { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dist-row .bar { height: 8px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
.dist-row .bar span { display: block; height: 100%; border-radius: 6px; }
.dist-row b { text-align: right; font-variant-numeric: tabular-nums; }
.rec { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; background: rgba(255,255,255,.03); }
.rec + .rec { margin-top: 10px; }
.rec .rank { font-family: var(--display); font-size: 22px; line-height: 1; color: var(--accent); }
.rec .head { display: flex; gap: 10px; align-items: baseline; }
.rec .why { font-size: 12.5px; color: var(--ink-dim); }
.rec .why b { color: var(--ink); font-weight: 700; }
.rec .actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* アンケート */
.sheet-wrap { position: fixed; inset: 0; z-index: 10; background: rgba(5, 8, 25, .55); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { width: min(720px, 100%); max-height: min(90vh, 760px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; }
.sheet header { padding: 16px 20px 6px; display: flex; gap: 10px; align-items: center; }
.sheet header h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; flex: 1; }
.progress { display: flex; gap: 4px; }
.progress i { width: 26px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.15); }
.progress i.on { background: var(--accent); }
.sheet .body { padding: 6px 20px 12px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.sheet footer { display: flex; gap: 8px; justify-content: space-between; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.q { font-size: 16px; font-weight: 700; margin: 8px 0 4px; }
.q-sub { color: var(--ink-dim); font-size: 13px; margin: 0 0 12px; }
.grid-choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; }
.choice { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 12px; padding: 10px 12px; text-align: left; display: flex; gap: 8px; align-items: center; min-height: 48px; }
.choice .e { font-size: 20px; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 209, 102, .14); }
.avatars { display: flex; flex-wrap: wrap; gap: 8px; }
.avatars .choice { font-size: 28px; padding: 6px 12px; min-height: 0; }
.field-input { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: inherit; padding: 10px 12px; }
textarea.field-input { min-height: 96px; resize: vertical; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.tooltip { position: fixed; z-index: 8; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; max-width: 260px; transform: translate(12px, 12px); }

@media (max-width: 720px) {
  .legend { display: none; }
  .hint { display: none; }
  .brand p { display: none; }
  .search input { width: 9em; }
  .panel { top: auto; left: 0; right: 0; width: auto; bottom: 0; height: 58%; border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .dock { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  body.panel-open .dock { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  <div class="sheet">
    <header><h2 id="quizTitle">あなたの星をつくろう</h2><div class="progress" id="quizProgress"></div><button class="btn small" id="quizClose" aria-label="閉じる">×</button></header>

      </div>
    </footer>
  </div>
</div>

}

const nodes = []; // {type, i, obj, mesh, label, pos, color, baseScale}
const pickables = [];
const sphere = new THREE.SphereGeometry(1, 20, 14);
function addNode(type, i, pos, color, r, labelText, labelSize, showLabel) {
  const g = new THREE.Group(); g.position.set(...pos);
  const mesh = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color, transparent: true }));
  mesh.scale.setScalar(r); g.add(mesh);

  scene.add(g);

  mesh.userData.node = n; pickables.push(mesh); nodes.push(n); return n;
}

const fieldNodes = D.fields.map((f, i) => addNode('field', i, f.pos, f.color, 9, f.name, 11, true));
const lessonNodes = D.lessons.map((l, i) => addNode('lesson', i, l.pos, D.fields[l.field].color, 2.6, `${FIELD_SHORT[l.field]} ${l.code}`, 4.2, false));

// エッジ
const kwLessons = D.keywords.map(() => []);
const edgeList = [];
D.lessons.forEach((l, i) => {
  edgeList.push([lessonNodes[i], fieldNodes[l.field], 0.32]);
  l.kw.forEach(([k, w]) => { edgeList.push([lessonNodes[i], kwNodes[k], 0.10 + 0.14 * w]); kwLessons[k].push([i, w]); });
});
function buildLines(list, opacityScale = 1) {
  const pos = new Float32Array(list.length * 6), col = new Float32Array(list.length * 6);
  list.forEach(([a, b, s], k) => {
    pos.set([a.pos.x, a.pos.y, a.pos.z, b.pos.x, b.pos.y, b.pos.z], k * 6);
    const ca = a.color.clone().multiplyScalar(s * opacityScale), cb = b.color.clone().multiplyScalar(s * opacityScale);
    col.set([ca.r, ca.g, ca.b, cb.r, cb.g, cb.b], k * 6);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
}
const baseLines = buildLines(edgeList); scene.add(baseLines);
let hiLines = null;
function refreshLines(lines, list) {

  list.forEach(([x, y], k) => a.array.set([x.pos.x, x.pos.y, x.pos.z, y.pos.x, y.pos.y, y.pos.z], k * 6));

}

// ---------- レイアウト（3D / 平面 / 分野別） ----------
const graphNodes = nodes.slice();
graphNodes.forEach((n) => { n.home = n.pos.clone(); });
const layouts = { '3d': new Map(graphNodes.map((n) => [n, n.home.clone()])) };
// 平面：3D配置を、いちばん広がって見える面（主成分）に写す
{
  const ps = graphNodes.map((n) => n.home); const m = new THREE.Vector3();
  ps.forEach((p) => m.add(p)); m.divideScalar(ps.length);
  const C = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
  ps.forEach((p) => { const d = [p.x - m.x, p.y - m.y, p.z - m.z]; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C[i][j] += d[i] * d[j]; });
  const power = (M, v) => { for (let it = 0; it < 60; it++) { const w = M.map((r) => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]); const l = Math.hypot(...w); v = w.map((x) => x / l); } return v; };
  const v1 = power(C, [1, .3, .2]); const lam = v1.reduce((s, x, i) => s + x * C[i].reduce((t, c, j) => t + c * v1[j], 0), 0);
  const C2 = C.map((r, i) => r.map((c, j) => c - lam * v1[i] * v1[j])); const v2 = power(C2, [.2, 1, .3]);
  layouts.flat = new Map(graphNodes.map((n) => { const d = [n.home.x - m.x, n.home.y - m.y, n.home.z - m.z];
    return [n, new THREE.Vector3(1.2 * (d[0] * v1[0] + d[1] * v1[1] + d[2] * v1[2]), 1.2 * (d[0] * v2[0] + d[1] * v2[1] + d[2] * v2[2]), 0)]; }));
}
// 分野別：分野を円形に並べ、単元を章ごとの輪（内側が第1章）に置く。キーワードはつながる単元の中間に置く
{
  const map = new Map(); const R = 235;
  D.fields.forEach((f, fi) => {
    const a = -Math.PI / 2 + fi * 2 * Math.PI / D.fields.length; const c = new THREE.Vector3(R * Math.cos(a), R * Math.sin(a), 0);
    map.set(fieldNodes[fi], c);
    f.chapters.forEach((ch) => {
      const ls = D.lessons.map((l, i) => [l, i]).filter(([l]) => l.field === fi && l.chapter === ch.no).map(([, i]) => i);
      const r = 18 + ch.no * 15;
      ls.forEach((i, k) => { const b = (k / ls.length) * Math.PI * 2 + ch.no * 0.7; map.set(lessonNodes[i], c.clone().add(new THREE.Vector3(r * Math.cos(b), r * Math.sin(b), 0))); });
    });
  });
  kwNodes.forEach((n, j) => {
    const p = new THREE.Vector3(); let ws = 0;
    kwLessons[j].forEach(([i, w]) => { p.addScaledVector(map.get(lessonNodes[i]), w); ws += w; });
    p.divideScalar(ws || 1);
    const b = j * 2.399; p.add(new THREE.Vector3(10 * Math.cos(b), 10 * Math.sin(b), 0));
    map.set(n, p);
  });
  layouts.fields = map;
}
let layoutTween = null;
function morphTo(target, { intro = false, dur = 1600, done } = {}) {
  const items = graphNodes.map((n) => {
    const to = target.get(n);
    return { n, from: intro ? new THREE.Vector3() : n.pos.clone(), to, delay: intro ? 0.5 * Math.min(1, to.length() / 260) * (n.type === 'field' ? 0.2 : 1) : 0 };
  });
  if (!intro) graphNodes.forEach((n) => n.obj.scale.setScalar(1));
  if (hiLines) { scene.remove(hiLines); hiLines.geometry.dispose(); hiLines = null; }
  hideAvatar();
  // 起動直後は最初の描画が重いので、描画が始まってから時間を数える
  layoutTween = { t0: intro ? null : performance.now(), frames: 0, dur: reduceMotion ? 1 : dur, items, intro, done };
}
function stepLayout(now) {

  const t = (now - layoutTween.t0) / layoutTween.dur;
  layoutTween.items.forEach((it) => {
    const span = layoutTween.intro ? 0.5 : 1;
    const k = Math.min(1, Math.max(0, (t - it.delay) / span)); const e = ease(k);
    it.n.pos.lerpVectors(it.from, it.to, e);
    if (layoutTween.intro) it.n.obj.scale.setScalar(0.2 + 0.8 * e); // 最初から中心に小さく光って見える
  });
  refreshLines(baseLines, edgeList);
  if (t >= 1) { const d = layoutTween.done; layoutTween = null; d?.(); }
}

let selected = null;
function neighbors(n) {
  const set = new Set([n]);
  if (n.type === 'field') D.lessons.forEach((l, i) => { if (l.field === n.i) set.add(lessonNodes[i]); });
  if (n.type === 'lesson') { set.add(fieldNodes[D.lessons[n.i].field]); D.lessons[n.i].kw.forEach(([k]) => set.add(kwNodes[k])); }
  if (n.type === 'keyword') kwLessons[n.i].forEach(([i]) => { set.add(lessonNodes[i]); set.add(fieldNodes[D.lessons[i].field]); });
  return set;
}
let lastFocus = null;
function applyFocus(focusSet, extraEdges = []) {
  lastFocus = focusSet;
  nodes.forEach((n) => {
    const on = !focusSet || focusSet.has(n);
    n.mesh.material.opacity = on ? 1 : 0.12; n.glow.material.opacity = on ? .8 : .08;
    if (n.label) { n.label.visible = n.showLabel || (focusSet && on && n.type === 'lesson'); n.label.material.opacity = on ? 1 : 0.12; }
  });
  baseLines.material.opacity = focusSet ? 0.25 : 1;
  if (hiLines) { scene.remove(hiLines); hiLines.geometry.dispose(); hiLines = null; }
  if (focusSet) {
    const list = edgeList.filter(([a, b]) => focusSet.has(a) && focusSet.has(b) && (a === selected || b === selected || selected?.type === 'field')).map(([a, b]) => [a, b, 1]);

  }
}

}

const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2(); const tip = $('tooltip');
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const objs = pickables.filter((m) => m.material.opacity > .5 || !selected);
  const hit = ray.intersectObjects(objs, false)[0];
  if (hit) return hit.object.userData.node;
  // 小さな星は画面上の距離でも拾う
  let best = null, bd = 18;
  for (const m of objs) {
    const v = m.userData.node.pos.clone().project(camera); if (v.z > 1) continue;
    const x = (v.x + 1) / 2 * r.width + r.left, y = (1 - v.y) / 2 * r.height + r.top;
    const d = Math.hypot(x - ev.clientX, y - ev.clientY); if (d < bd) { bd = d; best = m.userData.node; }
  }
  return best;
}
function nodeName(n) {
  if (n.type === 'field') return D.fields[n.i].name;
  if (n.type === 'keyword') return `🔑 ${D.keywords[n.i].label}`;
  if (n.type === 'avatar') return `${avatar.emoji} ${avatar.name}`;
  const l = D.lessons[n.i]; return `${D.fields[l.field].name} ${l.code}<br><b>${esc(l.title)}</b>`;
}
renderer.domElement.addEventListener('pointermove', (ev) => {

});
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {

});

// ---------- レコメンド ----------
const NI = D.interests.length;
function analyzeText(text) {
  const iv = new Array(NI).fill(0); const kws = new Set(); const hits = new Set();
  if (!text) return { iv, kws, hits, tokens: [] };
  const t = text.normalize('NFKC');
  D.interests.forEach((it, a) => it.seeds.forEach((s) => { if (t.includes(s)) { iv[a] += 1; hits.add(s); } }));
  D.keywords.forEach((k, j) => { if (k.pats.some((p) => t.includes(p)) || t.includes(k.label)) { kws.add(j); hits.add(k.label); } });
  for (const [w, labels] of Object.entries(D.synonyms)) if (t.includes(w)) { hits.add(w); labels.forEach((lab) => { const j = D.keywords.findIndex((k) => k.label === lab); if (j >= 0) kws.add(j); }); }
  const tokens = (t.match(/[一-龠々〆ヵヶ]{2,}|[ァ-ヴー]{2,}|[A-Za-z][A-Za-z0-9]+/g) || []);
  return { iv, kws, hits, tokens };
}
function recommend(ans) {
  const u = new Array(NI).fill(0);
  ans.interests.forEach((id) => { u[D.interests.findIndex((x) => x.id === id)] += 1; });
  const userKw = new Map();
  ans.wishes.forEach((wid) => {
    const w = D.wishes.find((x) => x.id === wid);
    Object.entries(w.weights).forEach(([id, v]) => { u[D.interests.findIndex((x) => x.id === id)] += v / 3; });
    w.terms.forEach((lab) => { const j = D.keywords.findIndex((k) => k.label === lab); if (j >= 0) userKw.set(j, (userKw.get(j) || 0) + 1); });
  });
  const tx = analyzeText(ans.text);
  tx.iv.forEach((v, a) => { u[a] += Math.min(v, 2) * 0.5; });
  tx.kws.forEach((j) => userKw.set(j, (userKw.get(j) || 0) + 1.2));
  const un = Math.hypot(...u) || 1;
  const raw = D.lessons.map((l) => {
    const cos = u.reduce((s, v, a) => s + v * l.iv[a], 0) / un;
    let kw = 0; const kwHits = [];
    l.kw.forEach(([k, w]) => { if (userKw.has(k)) { kw += w * userKw.get(k); kwHits.push(k); } });
    let txs = 0; const termHits = [];
    if (ans.text) {
      const t = ans.text.normalize('NFKC');
      l.terms.forEach(([term, w]) => {
        if (t.includes(term) || tx.tokens.some((tok) => tok.length >= 2 && term.includes(tok))) { txs += w; termHits.push(term); }
      });
    }
    return { cos, kw, txs, kwHits, termHits };
  });
  const mk = Math.max(1e-9, ...raw.map((r) => r.kw)), mt = Math.max(1e-9, ...raw.map((r) => r.txs));
  const hasU = un > 1e-6 && u.some((v) => v > 0);
  const stageFit = { know: { 基礎: 1, 標準: .95, 発展: .85, 実践: .8 }, think: { 基礎: .9, 標準: 1, 発展: 1, 実践: .9 }, make: { 基礎: .8, 標準: .9, 発展: .95, 実践: 1 } }[ans.stage || 'think'];
  const scores = raw.map((r, i) => ((hasU ? 0.55 : 0) * r.cos + 0.25 * (r.kw / mk) + (ans.text ? 0.25 : 0) * (r.txs / mt)) * stageFit[D.lessons[i].stage]);
  const max = Math.max(...scores) || 1;
  const norm = scores.map((s) => s / max);
  const order = norm.map((s, i) => [s, i]).sort((a, b) => b[0] - a[0]).map(([, i]) => i);
  // 同じ分野ばかりにならないよう、上位5件は1分野2件まで
  const top = []; const perField = {};
  for (const i of order) { const f = D.lessons[i].field; if ((perField[f] || 0) >= 2) continue; perField[f] = (perField[f] || 0) + 1; top.push(i); if (top.length >= 5) break; }
  const fieldDist = D.fields.map((f, fi) => {
    const s = order.filter((i) => D.lessons[i].field === fi).slice(0, 3).map((i) => norm[i]);
    return s.reduce((a, b) => a + b, 0) / s.length;
  });
  const topInterests = u.map((v, a) => [v, a]).filter(([v]) => v > 0).sort((a, b) => b[0] - a[0]).slice(0, 3).map(([, a]) => a);
  return { scores: norm, top, raw, fieldDist, u, topInterests, hits: [...tx.hits] };
}
const distOf = (s) => Math.round((1 - s) * 100);

let avatar = null; let avatarNode = null; let avatarLines = null; const avatarLabels = [];
let lastResult = null;
function emojiSprite(emoji, size) {
  const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d');
  x.fillStyle = 'rgba(255,209,102,.25)'; x.beginPath(); x.arc(80, 80, 76, 0, Math.PI * 2); x.fill();
  x.lineWidth = 6; x.strokeStyle = '#ffd166'; x.stroke();
  x.font = '96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(emoji, 80, 88);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, depthTest: false }));
  s.scale.set(size, size, 1); s.renderOrder = 10; return s;
}
function placeAvatar(res) {
  if (avatarNode) { scene.remove(avatarNode.obj); pickables.splice(pickables.indexOf(avatarNode.mesh), 1); nodes.splice(nodes.indexOf(avatarNode), 1); }
  if (avatarLines) scene.remove(avatarLines);
  avatarLabels.forEach((s) => scene.remove(s)); avatarLabels.length = 0;
  // 近い単元の重み付き平均の位置に、少し外側へずらして置く
  const ord = res.scores.map((s, i) => [s, i]).sort((a, b) => b[0] - a[0]).slice(0, 8);
  const p = new THREE.Vector3(); let ws = 0;
  ord.forEach(([s, i]) => { const w = s ** 4; p.addScaledVector(lessonNodes[i].pos, w); ws += w; });
  p.divideScalar(ws || 1);
  p.add(p.clone().normalize().multiplyScalar(28));
  const g = new THREE.Group(); g.position.copy(p);
  const mesh = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0 })); mesh.scale.setScalar(9); g.add(mesh);
  g.add(emojiSprite(avatar.emoji, 20));
  const glow = glowSprite(0xffd166, 70); g.add(glow);
  const label = textSprite(avatar.name, { size: 6, color: '#ffd166' }); label.position.y = 16; g.add(label);
  scene.add(g);
  avatarNode = { type: 'avatar', obj: g, mesh, glow, label, pos: g.position, color: new THREE.Color(0xffd166), showLabel: true, r: 9 };
  mesh.userData.node = avatarNode; pickables.push(mesh); nodes.push(avatarNode);
  // 距離を示す線：5分野（細）とおすすめ上位3単元（太め）
  const list = [];
  D.fields.forEach((f, fi) => list.push([avatarNode, fieldNodes[fi], 0.25 + 0.5 * res.fieldDist[fi]]));
  res.top.slice(0, 3).forEach((i) => list.push([avatarNode, lessonNodes[i], 1]));
  avatarLines = buildLines(list); scene.add(avatarLines);
  D.fields.forEach((f, fi) => {
    const s = textSprite(`${FIELD_SHORT[fi]}まで ${distOf(res.fieldDist[fi])}`, { size: 4, color: f.color });
    s.position.lerpVectors(p, fieldNodes[fi].pos, 0.5); scene.add(s); avatarLabels.push(s);
  });
}

function openRec() {
  const res = lastResult; if (!res) return;
  const fd = D.fields.map((f, fi) => [res.fieldDist[fi], fi]).sort((a, b) => b[0] - a[0]);
  const why = (i) => {
    const l = D.lessons[i]; const r = res.raw[i]; const parts = [];
    const ia = res.topInterests.filter((a) => l.iv[a] >= 0.3).map((a) => `${D.interests[a].emoji}${D.interests[a].label}`);
    if (ia.length) parts.push(`あなたの好きな <b>${esc(ia.join('・'))}</b> に近い`);
    if (r.kwHits.length) parts.push(`キーワード <b>${esc(r.kwHits.map((k) => D.keywords[k].label).join('・'))}</b> が出てくる`);
    if (r.termHits.length) parts.push(`あなたの言葉に関係する <b>${esc(r.termHits.slice(0, 3).join('・'))}</b> をあつかう`);
    return parts.join('。') || '全体の傾向が近い';
  };
  const recs = res.top.map((i, k) => {
    const l = D.lessons[i]; const f = D.fields[l.field];
    return `<article class="rec"><div class="head"><span class="rank">${k + 1}</span><div style="min-width:0">
      <span class="fieldtag"><i style="background:${f.color}"></i>${esc(f.name)} ${l.code}</span> <span class="stage">${l.stage}</span>
      <div class="hook" style="font-size:15.5px">${esc(l.hook)}</div><p class="lesson-title">${esc(l.title)}</p></div></div>
      <div class="why">${why(i)}。距離 <b>${distOf(res.scores[i])}</b></div>
      <div class="actions"><button class="btn small" data-lesson="${i}">星図で見る・くわしく</button></div></article>`;
  }).join('');
  const dist = fd.map(([s, fi]) => `<div class="dist-row"><span class="fieldtag" title="${esc(D.fields[fi].name)}"><i style="background:${D.fields[fi].color}"></i>${esc(FIELD_SHORT[fi])}</span>
    <span class="bar"><span style="width:${Math.round(s * 100)}%;background:${D.fields[fi].color}"></span></span><b>${distOf(s)}</b></div>`).join('');
  const hits = res.hits.length ? `<p class="muted">あなたの言葉から拾ったこと：${esc(res.hits.slice(0, 8).join('、'))}</p>` : '';
  openPanel(`${avatar.emoji} ${avatar.name}へのおすすめ`, `
    <h3>あなたと各分野の距離（0に近いほど近い）</h3><div class="dist">${dist}</div>${hits}
    <h3>あなたにおすすめの教材</h3>${recs}
    <p class="muted" style="margin-top:12px">金色の星があなたです。線の先にある星ほど、あなたの興味に近い教材です。</p>`);
  selected = avatarNode;
  const set = new Set([avatarNode, ...fieldNodes, ...res.top.map((i) => lessonNodes[i])]);
  res.top.forEach((i) => D.lessons[i].kw.forEach(([k]) => set.add(kwNodes[k])));
  applyFocus(set);
  flyTo(avatarNode.pos, 210);
}
$('openRec').onclick = openRec;

// ---------- アンケート ----------
const AVATARS = ['🦊', '🐱', '🐼', '🐧', '🦉', '🐬', '🐸', '🦄', '🚀', '🌟', '🎧', '🍙'];
const ans = { emoji: '🦊', name: '', interests: [], wishes: [], text: '', stage: 'think' };
let step = 0;
const STEPS = [
  () => `<p class="q">まずは、あなたの星のすがたを選ぼう</p><p class="q-sub">星図の中にこのアバターがあらわれます。</p>
    <div class="avatars">${AVATARS.map((e) => `<button class="choice" data-avatar="${e}" aria-pressed="${ans.emoji === e}">${e}</button>`).join('')}</div>
    <p class="q" style="margin-top:18px"><label for="nick">ニックネーム（なくてもOK）</label></p>
    <input class="field-input" id="nick" maxlength="12" placeholder="例：たけひこ" value="${esc(ans.name)}">`,
  () => `<p class="q">好きなこと・つい時間を忘れることは？</p><p class="q-sub">いくつでも選べます（3つくらいがおすすめ）。</p>
    <div class="grid-choices">${D.interests.map((it) => `<button class="choice" data-interest="${it.id}" aria-pressed="${ans.interests.includes(it.id)}"><span class="e">${it.emoji}</span>${esc(it.label)}</button>`).join('')}</div>`,
  () => `<p class="q">やってみたいこと・解決してみたいことは？</p><p class="q-sub">3つまで選べます。教材を「やりたいこと」から逆引きします。</p>
    <div class="grid-choices">${D.wishes.map((w) => `<button class="choice" data-wish="${w.id}" aria-pressed="${ans.wishes.includes(w.id)}"><span class="e">${w.emoji}</span>${esc(w.label)}</button>`).join('')}</div>`,
  () => `<p class="q"><label for="free">最近気になっていること、自由に書いてみよう</label></p><p class="q-sub">短くてOK。書いた言葉と教材の中の言葉を照らし合わせます。</p>
    <textarea class="field-input" id="free" placeholder="例：部活のサッカーでPKをもっと決めたい。夜ふかしをやめたい。">${esc(ans.text)}</textarea>
    <p class="q" style="margin-top:18px">どんなふうに学びたい？</p>
    <div class="seg">${[['know', 'まずはしくみを知りたい'], ['think', '調べて考えたい'], ['make', 'すぐに作ってためしたい']].map(([v, t]) => `<button class="choice" data-stage="${v}" aria-pressed="${ans.stage === v}">${t}</button>`).join('')}</div>`,
];
function renderQuiz() {
  $('quizBody').innerHTML = STEPS[step]();
  $('quizProgress').innerHTML = STEPS.map((_, k) => `<i class="${k <= step ? 'on' : ''}"></i>`).join('');
  $('quizBack').style.visibility = step ? 'visible' : 'hidden';
  $('quizNext').textContent = step === STEPS.length - 1 ? '星図にあらわれる ✨' : 'つぎへ';
}
function saveInputs() { const n = $('nick'); if (n) ans.name = n.value.trim(); const f = $('free'); if (f) ans.text = f.value.trim(); }
$('quizBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('.choice'); if (!b) return;
  if (b.dataset.avatar) ans.emoji = b.dataset.avatar;
  if (b.dataset.interest) { const id = b.dataset.interest; ans.interests = ans.interests.includes(id) ? ans.interests.filter((x) => x !== id) : [...ans.interests, id]; }
  if (b.dataset.wish) { const id = b.dataset.wish; if (ans.wishes.includes(id)) ans.wishes = ans.wishes.filter((x) => x !== id); else if (ans.wishes.length < 3) ans.wishes = [...ans.wishes, id]; }
  if (b.dataset.stage) ans.stage = b.dataset.stage;
  saveInputs(); renderQuiz();
});
$('openQuiz').onclick = () => { step = 0; renderQuiz(); $('quiz').hidden = false; };
$('quizClose').onclick = () => { $('quiz').hidden = true; };
$('quizBack').onclick = () => { saveInputs(); step = Math.max(0, step - 1); renderQuiz(); };
$('quizNext').onclick = () => {
  saveInputs();
  if (step < STEPS.length - 1) { step++; renderQuiz(); return; }
  if (!ans.interests.length && !ans.wishes.length && !ans.text) { $('quizBody').insertAdjacentHTML('beforeend', '<p class="q-sub" style="color:var(--accent)">好きなこと・やってみたいこと・自由記述のどれか1つは入れてください。</p>'); return; }
  finish();
};
function finish() {
  $('quiz').hidden = true;
  avatar = { emoji: ans.emoji, name: ans.name || 'あなた' };
  lastResult = recommend(ans);
  placeAvatar(lastResult);
  $('openRec').hidden = false;
  openRec();
}

function hideAvatar() {
  if (avatarNode) avatarNode.obj.visible = false;
  if (avatarLines) avatarLines.visible = false;
  avatarLabels.forEach((s) => { s.visible = false; });
}

// ---------- 表示モードの切り替え ----------
const HINTS = { '3d': 'ドラッグ：回転　ホイール/ピンチ：拡大縮小　右ドラッグ/2本指：移動', flat: 'ドラッグ：移動　ホイール/ピンチ：拡大縮小', fields: '内側の輪ほど前の章（基礎）です　ドラッグ：移動　ホイール/ピンチ：拡大縮小' };
function setMode(m) {
  if (m === mode && !layoutTween) return;
  mode = m;
  document.querySelectorAll('#modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('hint').textContent = HINTS[m];
  const flat = m !== '3d';
  controls.enableRotate = !flat;
  controls.mouseButtons.LEFT = flat ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
  controls.touches.ONE = flat ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
  controls.autoRotate = !flat && !reduceMotion && !selected;
  tween = { t0: performance.now(), dur: reduceMotion ? 1 : 1400, fromPos: camera.position.clone(), toPos: VIEW[m].clone(), fromT: controls.target.clone(), toT: new THREE.Vector3() };
  morphTo(layouts[m], { done: afterMorph });
}
function afterMorph() {
  if (lastResult) placeAvatar(lastResult);
  if (selected === avatarNode && lastResult) openRec();
  else if (selected) applyFocus(neighbors(selected));
  else if (lastFocus) applyFocus(lastFocus);
}
$('modes').addEventListener('click', (ev) => { const b = ev.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });

// 起動時：中心からネットワークが広がる
graphNodes.forEach((n) => { n.pos.set(0, 0, 0); n.obj.scale.setScalar(0.001); });
refreshLines(baseLines, edgeList); // 線も中心に集めておく（起動時に完成図が一瞬見えないように）
morphTo(layouts['3d'], { intro: true, dur: 3200 });

// ---------- ループ ----------
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function loop(now) {
  if (layoutTween) stepLayout(now);
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
    camera.position.lerpVectors(tween.fromPos, tween.toPos, e); controls.target.lerpVectors(tween.fromT, tween.toT, e);
    if (k >= 1) tween = null;
  }
  if (avatarNode && !reduceMotion) { const s = 1 + 0.12 * Math.sin(now / 400); avatarNode.glow.scale.set(70 * s, 70 * s, 1); }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; updateViewOffset(); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { if (!$('quiz').hidden) $('quiz').hidden = true; else home(); } });

// 日本語フォントの読み込みを待ってからラベルを描き直す
document.fonts.load('700 64px "Zen Maru Gothic"').then(() => {
  nodes.forEach((n) => {
    if (!n.label || n.type === 'avatar') return;
    const text = n.type === 'field' ? D.fields[n.i].name : n.type === 'keyword' ? D.keywords[n.i].label : `${FIELD_SHORT[D.lessons[n.i].field]} ${D.lessons[n.i].code}`;
    const fresh = textSprite(text, { size: n.type === 'field' ? 11 : n.type === 'keyword' ? 5.2 : 4.2 });
    fresh.position.copy(n.label.position); fresh.visible = n.label.visible; fresh.material.opacity = n.label.material.opacity;
    n.obj.remove(n.label); n.label.material.map.dispose(); n.obj.add(fresh); n.label = fresh;
  });
}).catch(() => {});
requestAnimationFrame(loop);
window.__app = { recommend, D, select, lessonNodes };
</script>

</body>
</html>
